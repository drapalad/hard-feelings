name: AI code reviewer
description: Review a git diff with packages/code-reviewer and expose verdict plus summary

inputs:
  pr-number:
    description: Pull request number (used when posting the comment)
    required: true
  base-ref:
    description: Base branch name without the origin/ prefix
    required: true
  openrouter-api-key:
    description: OpenRouter API key (GitHub Secret). Never echo.
    required: true
  openrouter-model:
    description: OpenRouter model id (GitHub Actions variable OPENROUTER_MODEL). Empty uses the reviewer default.
    required: false
    default: ""

outputs:
  verdict:
    description: pass or fail
    value: ${{ steps.parse.outputs.verdict }}
  summary:
    description: Markdown summary for a pull-request comment
    value: ${{ steps.parse.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: ${{ github.workspace }}/package-lock.json

    - name: Install
      shell: bash
      working-directory: ${{ github.workspace }}
      run: npm ci

    - name: Review diff
      id: parse
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        OPENROUTER_MODEL: ${{ inputs.openrouter-model }}
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        set -euo pipefail
        if [ -z "${OPENROUTER_API_KEY}" ]; then
          echo "OPENROUTER_API_KEY is missing. Add it as a GitHub Actions secret." >&2
          exit 1
        fi
        if [ -z "${OPENROUTER_MODEL}" ]; then
          unset OPENROUTER_MODEL
        fi
        git fetch --no-tags origin "${BASE_REF}"
        git diff "origin/${BASE_REF}...HEAD" > "${RUNNER_TEMP}/pr.diff"
        if [ ! -s "${RUNNER_TEMP}/pr.diff" ]; then
          echo "Empty diff against origin/${BASE_REF}; nothing to review." >&2
          exit 1
        fi
        npm run review --workspace=code-reviewer --silent < "${RUNNER_TEMP}/pr.diff" > "${RUNNER_TEMP}/review.json"
        jq -e '.verdict == "pass" or .verdict == "fail"' "${RUNNER_TEMP}/review.json" >/dev/null
        echo "review.json"
        jq '{verdict, criteria, summary}' "${RUNNER_TEMP}/review.json"
        {
          echo "verdict=$(jq -r '.verdict' "${RUNNER_TEMP}/review.json")"
          echo "summary<<HF_SUMMARY"
          jq -r '.summary' "${RUNNER_TEMP}/review.json"
          echo "HF_SUMMARY"
        } >> "${GITHUB_OUTPUT}"

    - name: Comment and labels
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        VERDICT: ${{ steps.parse.outputs.verdict }}
      run: |
        set -euo pipefail
        jq -r '.summary' "${RUNNER_TEMP}/review.json" > "${RUNNER_TEMP}/summary.md"
        gh pr comment "${PR_NUMBER}" --body-file "${RUNNER_TEMP}/summary.md"
        gh label create "ai-cr:passed" --color "0E8A16" --description "AI code review passed" --force
        gh label create "ai-cr:failed" --color "B60205" --description "AI code review failed" --force
        if [ "${VERDICT}" = "pass" ]; then
          gh pr edit "${PR_NUMBER}" --remove-label "ai-cr:failed" || true
          gh pr edit "${PR_NUMBER}" --add-label "ai-cr:passed"
        else
          gh pr edit "${PR_NUMBER}" --remove-label "ai-cr:passed" || true
          gh pr edit "${PR_NUMBER}" --add-label "ai-cr:failed"
        fi
